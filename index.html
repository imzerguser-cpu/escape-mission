<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🔑 미션 방탈출</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap');
:root{--navy:#1B2E4A;--navy-l:#2A4470;--navy-g:#3B6BA5;--sky:#4DA3E8;--sky-p:#E8F4FD;--red:#E0465A;--green:#2DAA6E;--orange:#E8833A;--gold:#D4A017;--purple:#B15CFF;--bg:#F3F5F8;--card:#FFF;--tx:#1E2D3D;--tx2:#6B7D8F;--tx3:#A4B3C2;--bdr:#E0E7EF;--sh:0 1px 4px rgba(27,46,74,.07);--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;min-height:100vh;overflow-x:hidden;}

/* ===== 학생 화면 (#studentRoot 스코프) — 유령 학교의 저주 테마 ===== */
#studentRoot{
  --gs-bg:#120d21;
  --gs-ink:#efe6cf;
  --gs-gold:#ffcf7a;
  --gs-gold-lt:#ffe9b8;
  --gs-lilac:#c9b9e8;
  --gs-lilac-lt:#e2c6ff;
  --gs-green:#9ce6b4;
  --gs-red:#ff8fa0;
  --gs-parchment-1:rgba(236,220,180,.96);
  --gs-parchment-2:rgba(214,193,146,.96);
  --gs-ink-brown:#3f2c14;
  --gs-ink-brown-2:#5f4a26;
  --gs-stone-1:rgba(58,40,96,.9);
  --gs-stone-2:rgba(34,23,62,.92);
  --gs-stone-border:rgba(255,205,130,.4);
  --gs-success-1:rgba(60,86,58,.9);
  --gs-success-2:rgba(28,48,32,.92);
  --gs-success-border:rgba(140,230,160,.5);
  position:relative;
  background:var(--gs-bg);
  color:var(--gs-ink);
  font-family:'Nanum Gothic',sans-serif;
  min-height:100vh;
}
#studentRoot h1,#studentRoot h2,#studentRoot h3{font-family:'Nanum Myeongjo',serif;}

@keyframes gs-drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gs-flicker{0%,100%{opacity:.9}45%{opacity:1}70%{opacity:.74}}
@keyframes gs-twinkle{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.05)}}
#studentRoot .gs-drift{animation:gs-drift 6s ease-in-out infinite;}
#studentRoot .gs-flicker{animation:gs-flicker 2.8s infinite;}
#studentRoot .gs-twinkle{animation:gs-twinkle 2.6s ease-in-out infinite;}
@media (prefers-reduced-motion: reduce){
  #studentRoot .gs-drift,#studentRoot .gs-flicker,#studentRoot .gs-twinkle{animation:none!important;}
}

/* 배경 장면 (data-scene 속성으로 전환) */
#studentRoot[data-scene="gate"]{
  background-image:linear-gradient(180deg,rgba(18,13,33,.35),rgba(18,13,33,.82)),url('assets/background_castle_gate.png');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed;
}
#studentRoot[data-scene="village"]{
  background-image:linear-gradient(180deg,rgba(18,13,33,.4),rgba(18,13,33,.85)),url('assets/background_classroom_select.png');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed;
}
#studentRoot[data-scene="corridor"]{
  background-image:linear-gradient(180deg,rgba(18,13,33,.3),rgba(18,13,33,.8)),url('assets/background_mission_select.png');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed;
}
#studentRoot[data-scene="study"]{
  background-image:linear-gradient(180deg,rgba(18,13,33,.35),rgba(18,13,33,.82)),url('assets/background_problem_example.png');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed;
}
#studentRoot[data-scene="guide"]{
  background-image:linear-gradient(180deg,rgba(18,13,33,.3),rgba(18,13,33,.8)),url('assets/background_mission_guide.png');
  background-size:cover,cover;background-position:center,center;background-repeat:no-repeat,no-repeat;background-attachment:fixed,fixed;
}

#studentRoot .decor-img{position:fixed;z-index:-1;pointer-events:none;}

#studentRoot .hd{background:linear-gradient(180deg,#1b1430,#120d21);color:var(--gs-gold-lt);padding:12px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 16px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(255,205,130,.35);}
#studentRoot .hd-l{display:flex;flex-direction:column;}
#studentRoot .hd-title{font-family:'Nanum Myeongjo',serif;font-size:16px;font-weight:800;color:var(--gs-gold-lt);text-shadow:0 2px 6px rgba(0,0,0,.7);}
#studentRoot .hd-team{font-size:11px;color:var(--gs-lilac);margin-top:1px;}
#studentRoot .sync-ind{font-size:10px;color:var(--gs-lilac);display:flex;align-items:center;gap:4px;}
#studentRoot .sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
#studentRoot .sync-on{background:#7ee39c;box-shadow:0 0 8px rgba(126,227,156,.9);}
#studentRoot .sync-off{background:#f0c05a;}
#studentRoot .sync-err{background:#ff6b7a;}
#studentRoot .wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px;position:relative;z-index:1;}

#studentRoot .btn{border:none;border-radius:10px;cursor:pointer;font-family:'Nanum Gothic',sans-serif;font-weight:800;transition:.12s;}
#studentRoot .btn:active{transform:scale(.97);}
#studentRoot .btn:disabled{opacity:.55;cursor:default;}
#studentRoot .btn-lg{padding:16px;font-size:17px;width:100%;}
#studentRoot .btn-primary{background:linear-gradient(180deg,#ffe9b8,#d9a03e);color:#3f2c14;box-shadow:0 6px 16px rgba(0,0,0,.45);}
#studentRoot .btn-sub{background:rgba(46,32,80,.7);color:var(--gs-gold-lt);border:2px solid rgba(255,205,130,.4);}
#studentRoot .btn-danger{background:#c94a5a;color:#fff4dc;}
#studentRoot .btn-green{background:linear-gradient(180deg,#bdf0cd,#5fb87e);color:#173821;}

#studentRoot .card{background-image:linear-gradient(170deg,var(--gs-parchment-1),var(--gs-parchment-2));border-radius:14px;box-shadow:0 14px 32px rgba(0,0,0,.55);padding:18px;margin-bottom:14px;color:var(--gs-ink-brown);border:1px solid rgba(140,105,55,.35);}
#studentRoot .card h2{color:var(--gs-ink-brown);}
#studentRoot .card p{color:var(--gs-ink-brown-2);}

#studentRoot .hero-block{display:flex;flex-direction:column;align-items:center;padding:22px 16px 26px;position:relative;z-index:1;}
#studentRoot .wood-sign-wrap{position:relative;display:inline-block;}
#studentRoot .wood-sign-img{display:block;width:190px;}
#studentRoot .wood-sign-label{position:absolute;left:0;right:0;top:32%;text-align:center;font-family:'Nanum Myeongjo',serif;font-size:20px;font-weight:800;color:var(--gs-gold-lt);text-shadow:0 2px 4px rgba(0,0,0,.8);}
#studentRoot .hero-title{margin-top:18px;font-family:'Nanum Myeongjo',serif;font-size:34px;font-weight:800;line-height:1.3;color:#fff4dc;text-shadow:0 0 20px rgba(255,190,90,.6),0 4px 10px rgba(0,0,0,.85);text-align:center;white-space:nowrap;}
#studentRoot .hero-sub{margin-top:10px;font-family:'Nanum Gothic',sans-serif;font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--gs-lilac-lt);text-shadow:0 2px 8px rgba(0,0,0,.8);text-align:center;}
#studentRoot[data-scene="village"] .hero-sub{font-family:'Nanum Myeongjo',serif;font-size:26px;font-weight:800;letter-spacing:0;white-space:nowrap;}
@media (max-width:700px){
  #studentRoot .hero-title{font-size:26px;}
  #studentRoot[data-scene="village"] .hero-sub{font-size:20px;}
}

#studentRoot .team-btn{width:100%;padding:12px 22px 12px 14px;border-radius:10px;border:none;cursor:pointer;font-family:'Nanum Gothic',sans-serif;background-image:linear-gradient(100deg,var(--gs-parchment-1),var(--gs-parchment-2));box-shadow:0 6px 18px rgba(0,0,0,.5);display:flex;align-items:center;gap:16px;text-align:left;transition:.12s;}
#studentRoot .team-btn:active{transform:scale(.98);}
#studentRoot .team-btn-icon{width:44px;flex:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45));}
#studentRoot .team-btn-body{min-width:0;display:flex;flex-direction:column;gap:2px;}
#studentRoot .team-btn-name{font-family:'Nanum Myeongjo',serif;font-size:18px;font-weight:800;color:var(--gs-ink-brown);}
#studentRoot .team-btn-members{font-size:12.5px;color:var(--gs-ink-brown-2);line-height:1.4;word-break:keep-all;}

#studentRoot[data-scene="village"] .wrap{max-width:1040px;}
#studentRoot[data-scene="corridor"] .wrap{max-width:1040px;}
#studentRoot .stage{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap;}
#studentRoot .room-grid-3col{flex:1 1 480px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start;}
#studentRoot .scan-btn-img{width:100%;max-width:200px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));cursor:pointer;display:block;margin:0 auto;}
#studentRoot .room-card{background-image:linear-gradient(170deg,var(--gs-stone-1),var(--gs-stone-2));border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.55);padding:16px 12px;text-align:center;border:2px solid var(--gs-stone-border);cursor:pointer;color:var(--gs-gold-lt);}
#studentRoot .room-card.done{border-color:var(--gs-success-border);background-image:linear-gradient(170deg,var(--gs-success-1),var(--gs-success-2));color:#e6ffe9;}
/* 교실 카드 배경을 사진으로 쓸 때: 하단만 어둡게 그라디언트를 얹어 진행도 글자가 늘 잘 보이게 함 */
#studentRoot .room-card.has-photo{background-image:linear-gradient(180deg,rgba(15,10,25,.05) 0%,rgba(15,10,25,.15) 55%,rgba(8,6,15,.92) 100%),var(--room-photo);background-size:cover;background-position:center;border-color:rgba(255,205,130,.55);}
#studentRoot .room-card.has-photo.done{background-image:linear-gradient(180deg,rgba(20,60,30,.1) 0%,rgba(15,50,25,.3) 55%,rgba(8,45,18,.88) 100%),var(--room-photo);}
#studentRoot .final-card.has-photo{background-image:linear-gradient(180deg,rgba(15,10,25,.05) 0%,rgba(15,10,25,.15) 55%,rgba(8,6,15,.92) 100%),var(--room-photo);background-size:cover;background-position:center;}
#studentRoot .final-card.has-photo.done{background-image:linear-gradient(180deg,rgba(20,60,30,.1) 0%,rgba(15,50,25,.3) 55%,rgba(8,45,18,.88) 100%),var(--room-photo);}
#studentRoot[data-scene="village"] .room-card.has-photo,#studentRoot[data-scene="village"] .final-card.has-photo{justify-content:flex-end;}
#studentRoot .room-emoji{font-size:32px;}
/* 홈 화면(village)만: 가로 폭이 넓을 때 오른쪽 교실 카드가 화면 아래 여백 없이 꽉 차도록 세로로도 늘림 */
#studentRoot[data-scene="village"]{display:flex;flex-direction:column;}
#studentRoot[data-scene="village"] .wrap{flex:1;display:flex;flex-direction:column;}
#studentRoot[data-scene="village"] .stage{flex:1;align-items:stretch;}
#studentRoot[data-scene="village"] .side-panel{justify-content:center;}
#studentRoot[data-scene="village"] .room-grid-3col{grid-template-rows:repeat(2,1fr);}
#studentRoot[data-scene="village"] .room-card,#studentRoot[data-scene="village"] .final-card{display:flex;flex-direction:column;justify-content:center;}
#studentRoot .room-emoji img{width:56px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55));}
#studentRoot .room-name{font-family:'Nanum Myeongjo',serif;font-size:14px;font-weight:800;margin-top:4px;}
#studentRoot .room-prog{font-size:12px;color:var(--gs-lilac);margin-top:4px;font-weight:700;}
#studentRoot .room-card.done .room-prog{color:var(--gs-green);}
#studentRoot .room-bar{height:6px;background:rgba(0,0,0,.35);border-radius:3px;margin-top:6px;overflow:hidden;}
#studentRoot .room-bar-f{height:100%;background:var(--gs-gold);border-radius:3px;transition:width .3s;}
#studentRoot .room-card.done .room-bar-f{background:var(--gs-green);}
#studentRoot .final-card{background-image:linear-gradient(170deg,var(--gs-stone-1),var(--gs-stone-2));border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.55);padding:16px 12px;text-align:center;border:2px solid var(--gs-gold);cursor:pointer;color:var(--gs-gold-lt);}
#studentRoot .final-card.done{border-color:var(--gs-success-border);background-image:linear-gradient(170deg,var(--gs-success-1),var(--gs-success-2));color:#e6ffe9;}

#studentRoot .team-switch{font-size:11px;color:var(--gs-lilac);text-align:center;margin-top:18px;text-decoration:underline;cursor:pointer;}

#studentRoot .scan-wrap{text-align:center;position:relative;z-index:1;}
#studentRoot .cam-box{position:relative;width:100%;max-width:420px;margin:10px auto;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;border:4px solid var(--gs-gold);box-shadow:0 0 24px rgba(255,205,120,.35),0 14px 30px rgba(0,0,0,.6);}
#studentRoot .cam-box video{width:100%;height:100%;object-fit:cover;}
#studentRoot .cam-frame{position:absolute;inset:14%;border:3px solid var(--gs-gold-lt);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.45);}
#studentRoot .cam-msg{font-size:12px;color:var(--gs-lilac);margin:8px 0;}
#studentRoot .manual-box{background-image:linear-gradient(170deg,var(--gs-parchment-1),var(--gs-parchment-2));border-radius:12px;box-shadow:0 10px 24px rgba(0,0,0,.5);padding:14px;margin-top:16px;color:var(--gs-ink-brown);}
#studentRoot .manual-box h4{font-size:13px;color:var(--gs-ink-brown-2);margin-bottom:8px;font-weight:700;}
#studentRoot .manual-row{display:flex;gap:8px;}

#studentRoot .txt-inp{flex:1;padding:12px;border:2px solid rgba(140,105,55,.4);border-radius:10px;font-size:16px;font-family:'Nanum Gothic',sans-serif;text-transform:uppercase;background:#fffaf0;color:var(--gs-ink-brown);}
#studentRoot .txt-inp:focus{border-color:var(--gs-gold);outline:none;}

#studentRoot .q-badges{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
#studentRoot .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}
#studentRoot .b-id{background:#2e2050;color:var(--gs-gold-lt);}
#studentRoot .b-grade{background:rgba(140,105,55,.18);color:var(--gs-ink-brown);}
#studentRoot .b-unit{background:rgba(140,105,55,.1);color:var(--gs-ink-brown-2);}
#studentRoot .grade-warn{background:rgba(140,105,55,.12);border:1px solid rgba(140,105,55,.3);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--gs-ink-brown-2);font-weight:700;margin-bottom:12px;}

#studentRoot .qimg{margin:10px 0;text-align:center;background:rgba(255,255,255,.35);border:1px solid rgba(140,105,55,.25);border-radius:10px;padding:10px;}
#studentRoot .qimg svg{width:100%;height:auto;max-width:320px;display:block;margin:0 auto;}
#studentRoot .qimg.wide svg{max-width:600px;}
#studentRoot .qimg table.plain{width:100%;max-width:230px;margin:0 auto 10px;border-collapse:collapse;}
#studentRoot .qimg table.plain th,#studentRoot .qimg table.plain td{border:1px solid rgba(140,105,55,.4);padding:5px 8px;font-size:12px;text-align:center;}
#studentRoot .qimg table.plain th{background:rgba(140,105,55,.12);}
#studentRoot .pictogram{font-size:30px;text-align:center;letter-spacing:8px;}
#studentRoot .dotgrid{font-size:19px;text-align:center;letter-spacing:2px;color:var(--gs-ink-brown-2);line-height:1.6;font-weight:700;}
#studentRoot .q-text{font-size:16px;font-weight:700;margin:12px 0;line-height:1.6;color:#fff;text-shadow:-1px -1px 0 rgba(20,14,10,.85),1px -1px 0 rgba(20,14,10,.85),-1px 1px 0 rgba(20,14,10,.85),1px 1px 0 rgba(20,14,10,.85),0 2px 6px rgba(0,0,0,.5);}
#studentRoot .ans-row{display:flex;gap:8px;margin-top:10px;}
#studentRoot .ans-row .txt-inp{text-transform:none;}

#studentRoot .fb-box{margin-top:14px;padding:14px;border-radius:12px;font-size:15px;font-weight:800;text-align:center;}
#studentRoot .fb-box img{width:28px;vertical-align:-6px;margin-right:6px;}
#studentRoot .fb-ok{background-image:linear-gradient(170deg,var(--gs-success-1),var(--gs-success-2));color:#e6ffe9;border:1px solid var(--gs-success-border);}
#studentRoot .fb-bad{background:rgba(90,20,30,.55);color:#ffd8dd;border:1px solid rgba(255,140,150,.4);}
#studentRoot .fb-lock{background:rgba(46,32,80,.7);color:var(--gs-gold-lt);border:1px solid rgba(255,205,130,.35);}
#studentRoot .fb-review{background:rgba(46,32,80,.5);color:var(--gs-lilac-lt);border:1px solid rgba(201,185,232,.35);}

#studentRoot .center-icon{font-size:42px;text-align:center;margin-bottom:6px;}

#studentRoot .scr-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;}
#studentRoot .scr-hd .lbl{font-size:12px;font-weight:800;color:var(--gs-ink-brown-2);}
#studentRoot .scr-hd button{border:1px solid rgba(140,105,55,.4);background:rgba(255,255,255,.4);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--gs-ink-brown);cursor:pointer;font-family:'Nanum Gothic',sans-serif;}
#studentRoot .canvas-wrap{position:relative;height:clamp(260px,46vh,460px);border:1px solid rgba(140,105,55,.4);border-radius:10px;background:#15111f;touch-action:none;overflow:hidden;margin-top:10px;}
#studentRoot .canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}

/* 문제 풀이 화면: 태블릿 가로 사용을 기본으로 하여 문제→정답 입력→풀이 공간을 위에서 아래로 한 줄로 배치 (세로 전환 대응 분기 없음) */
#studentRoot[data-scene="study"] .wrap{max-width:1040px;}
#studentRoot[data-scene="study"] .parchment-frame{max-width:960px;}

#studentRoot .finale{text-align:center;padding:40px 16px;position:relative;z-index:1;}
#studentRoot .finale .em{font-size:64px;}
#studentRoot .finale h2{font-size:22px;margin:10px 0;color:var(--gs-gold-lt);}
#studentRoot .finale p{font-size:14px;color:var(--gs-lilac);line-height:1.7;}
#studentRoot .top-back{font-size:13px;color:var(--gs-gold);font-weight:800;cursor:pointer;margin-bottom:10px;display:inline-block;position:relative;z-index:1;}

#studentRoot .modal-ov{position:fixed;inset:0;background:rgba(5,3,12,.75);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;}
#studentRoot .modal-box{background-image:linear-gradient(170deg,var(--gs-parchment-1),var(--gs-parchment-2));border-radius:16px;padding:26px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6);color:var(--gs-ink-brown);margin:auto;}
#studentRoot .modal-icon{width:56px;margin:0 auto 4px;display:block;}
#studentRoot .modal-box .em{font-size:56px;}
#studentRoot .modal-box h3{font-size:19px;margin:8px 0;color:var(--gs-ink-brown);}
#studentRoot .modal-box p{font-size:13px;color:var(--gs-ink-brown-2);line-height:1.6;margin-bottom:16px;text-align:left;}

/* 조/교실 상세 공용 레이아웃 */
#studentRoot .room-detail-layout{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;justify-content:center;position:relative;z-index:1;}
#studentRoot .room-detail-layout>.parchment-frame{margin:0;}
#studentRoot .side-panel{flex:0 0 200px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;}
#studentRoot .team-icon-img{width:90px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.7));}
#studentRoot .key-row{display:flex;justify-content:center;align-items:flex-end;gap:12px;flex-wrap:wrap;}
#studentRoot .key-icon{width:40px;filter:drop-shadow(0 0 14px rgba(255,205,120,.95));}
#studentRoot .key-icon.off{filter:grayscale(1) brightness(.5);opacity:.55;}
#studentRoot .note-box{background:rgba(46,32,80,.86);border:1px solid rgba(255,205,130,.35);border-radius:8px;padding:12px 10px;color:var(--gs-gold-lt);font-weight:700;font-size:14px;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.55);}
#studentRoot .note-box .sub{font-weight:400;color:var(--gs-lilac);font-size:11px;white-space:nowrap;}

#studentRoot .parchment-frame{flex:1 1 380px;max-width:520px;margin:0 auto;background-color:var(--gs-parchment-2);background-image:linear-gradient(180deg,rgba(20,14,32,.15),rgba(20,14,32,.15)),url('assets/background_problem_frame.png');background-size:100% 100%,100% 100%;background-repeat:no-repeat,no-repeat;padding:9% 10% 10%;box-sizing:border-box;}

/* 유튜브 주소(youtu.be/ID?t=562, watch?v=ID&t=9m22s 등)에서 영상 ID와 시작 초를 뽑아 embed 주소로 바꾼다 */
function youtubeEmbed(url){
  if(!url)return null;
  const m=url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  if(!m)return null;
  let start=0;
  const t=url.match(/[?&](?:t|start)=([0-9hms]+)/);
  if(t){
    const v=t[1];
    if(/^\d+$/.test(v))start=Number(v);
    else{const h=v.match(/(\d+)h/),mi=v.match(/(\d+)m/),s=v.match(/(\d+)s/);start=(h?Number(h[1])*3600:0)+(mi?Number(mi[1])*60:0)+(s?Number(s[1]):0);}
  }
  return "https://www.youtube.com/embed/"+m[1]+"?rel=0&playsinline=1"+(start?"&start="+start:"");
}

function teamMembers(n){
  return Object.values(rosterAll).filter(s=>s&&String(s.teamId)===String(n)).sort((a,b)=>(b.grade||0)-(a.grade||0)||(a.name||"").localeCompare(b.name||"","ko"));
}
function memberText(n){
  const m=teamMembers(n);
  return m.map(s=>escapeHtml(s.name)+(s.grade?"("+s.grade+")":"")).join(" · ");
}
function teamMissionsFromAll(n){return ((lastAllData["team"+n]||{}).missions)||{};}
function isOk(mmap,rid){return !!(mmap&&mmap[rid]&&mmap[rid].ok);}
function okCount(mmap){return MISSION_TEMPLATES.filter(t=>isOk(mmap,t.id)).length;}

function timeAgo(ts){

/* ===================== 관리자: 학생 배정 ===================== */
/* 첫 줄(제목 줄)에 "조"와 "이름" 칸이 있으면 시트에 적힌 조를 그대로 쓴다.
   없으면 기존 방식("학년, 이름" 또는 "학년, 반, 이름")으로 읽어서 자동 편성한다. */
function parseRosterWithTeams(rows){
  if(!rows||rows.length<2)return null;
  const hd=rows[0].map(c=>(c||"").toString().replace(/\s/g,""));
  const find=re=>hd.findIndex(c=>re.test(c));
  const iTeam=find(/^(조|모둠|팀|조번호|모둠번호)$|^(조|모둠)\(?/);
  const iName=find(/이름|성명/);
  if(iTeam<0||iName<0)return null;
  const iGrade=find(/학년/),iCls=find(/^반$|^반\(?/);
  const out=[];
  rows.slice(1).forEach(row=>{
    const name=(row[iName]||"").toString().trim();
    const tm=((row[iTeam]||"").toString().match(/\d+/)||[])[0];
    if(!name)return;
    const grade=iGrade>=0?parseInt(((row[iGrade]||"").toString().match(/\d+/)||[])[0],10):NaN;
    out.push({name,grade:Number.isInteger(grade)?grade:"",cls:iCls>=0?(row[iCls]||"").toString().trim():"",teamId:tm?Number(tm):""});
  });
  return out.length?out:null;
}
function rowsToStudents(rows){
  const withTeams=parseRosterWithTeams(rows);
  if(withTeams)return withTeams;
  return RosterUtils.parseRosterRows(rows);
}

async function loadFromGoogleSheet(){
  const url=document.getElementById("sheetUrlInp").value.trim();
  const id=RosterUtils.extractSheetId(url);
  if(!id){showRosterUploadErr("올바른 구글시트 링크가 아니에요.");return;}
  try{
    // 링크에 gid(시트 탭)가 있으면 그 탭을 읽는다
    const gid=(url.match(/[#&?]gid=(\d+)/)||[])[1];
    const res=await fetch(RosterUtils.buildSheetCsvUrl(id)+(gid?"&gid="+gid:""));
    if(!res.ok)throw new Error("fetch failed");
    const students=rowsToStudents(RosterUtils.parseCSV(await res.text()));
    if(!students||students.length===0){showRosterUploadErr("명단을 읽지 못했어요. 첫 줄에 '조, 이름' 제목이 있는지, 또는 '학년, 이름' 형식인지 확인해주세요.");return;}
    setParsedRoster(students);
  }catch(e){
    showRosterUploadErr("시트를 불러오지 못했어요. 공유 설정이 '링크가 있는 모든 사용자 - 뷰어'인지 확인해주세요.");
  }
}
function loadFromExcelFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1}).map(r=>r.map(c=>(c===undefined||c===null)?"":String(c)));
      const students=rowsToStudents(rows);
      if(!students||students.length===0){showRosterUploadErr("명단을 읽지 못했어요. 첫 줄에 '조, 이름' 제목이 있는지, 또는 '학년, 이름' 형식인지 확인해주세요.");return;}
      setParsedRoster(students);
    }catch(err){showRosterUploadErr("엑셀 파일을 읽지 못했어요.");}
  };
  reader.readAsArrayBuffer(file);
}
function confirmRoster(){
  const list=(parsedRosterPreview||[]).filter(s=>s.name&&s.name.trim());
  if(list.length===0)return;
  let assigned;
  const hasTeams=list.some(s=>s.teamId);
  if(hasTeams){
    const missing=list.filter(s=>!s.teamId);
    if(missing.length&&!confirm("조가 비어 있는 학생이 "+missing.length+"명 있어요. (미배정으로 저장돼요) 계속할까요?"))return;
    assigned=list;
  }else{
    const n=Math.min(30,Math.max(1,Math.floor(Number((document.getElementById("teamCountInp")||{}).value))||1));
    assigned=RosterUtils.autoAssignTeams(list.map(s=>Object.assign({},s,{grade:Number(s.grade)||1})),n);
  }
  const tc=assigned.reduce((m,s)=>Math.max(m,Number(s.teamId)||0),0);
  if(!confirm(list.length+"명 · "+tc+"개 조로 저장할까요? 기존 명단을 덮어씁니다. (미션 진행 기록은 그대로 유지돼요)"))return;
  const keys=new Set(),roster={};
  assigned.forEach(s=>{
    const key=RosterUtils.makeRosterKey(s.name,s.grade||0,keys);
    keys.add(key);
    roster[key]={name:s.name.trim(),grade:s.grade||"",cls:s.cls||"",teamId:s.teamId?String(s.teamId):null,ts:Date.now()};
  });
  dbRoot.update({roster:roster,"meta/teamCount":tc}).then(()=>{
    parsedRosterPreview=null;
    alert("저장되었습니다. 조장 태블릿에서 우리 조를 선택하면 돼요.");
  }).catch(err=>showRosterUploadErr("저장하지 못했어요: "+err.message));
}

/* ===================== 학생: 교실 입장/퇴장 (모든 태블릿 실시간 공유) ===================== */
/* occupy 전체를 transaction으로 바꿔서 두 조가 동시에 같은 교실을 누르는 경우에도 한 조만 들어가게 한다.
   한 조는 한 번에 한 교실만 쓸 수 있으므로, 다른 교실에 들어가 있었다면 그 교실은 자동으로 비운다. */
function startMission(rid){
  if(!team)return;
  if(isOk(missions,rid)){alert("이미 성공한 교실이에요!");return;}
  const cur=myRoomNow();
  if(cur&&cur!==rid&&!confirm("지금 '"+roomOf(cur).name+"'에서 미션 중이에요.\n그 교실을 비우고 '"+roomOf(rid).name+"'(으)로 옮길까요?"))return;
  let blockedBy=null;
  dbRoot.child("occupy").transaction(o=>{
    o=o||{};
    blockedBy=null;
    const here=o[rid];
    if(here&&String(here.team)!==team){blockedBy=here.team;return;} // 다른 조가 사용 중 → 취소
    Object.keys(o).forEach(k=>{if(o[k]&&String(o[k].team)===team)delete o[k];});
    o[rid]={team:team,ts:Date.now()};
    return o;
  }).then(res=>{
    if(!res.committed&&blockedBy)showInfoModal("assets/status_locked.png","앗, 한발 늦었어요!",blockedBy+"조가 방금 이 교실에서 미션을 시작했어요.<br>다른 빈 교실로 가보세요!");
  }).catch(e=>alert("연결이 불안정해요. 다시 눌러주세요. ("+e.message+")"));
}
function leaveMission(rid){
  if(!confirm("미션을 그만두고 이 교실을 비울까요?\n(다른 조가 이 교실을 쓸 수 있게 돼요)"))return;
  dbRoot.child("occupy/"+rid).transaction(o=>{
    if(o&&String(o.team)===team)return null;
    return; // 우리 조가 아니면 건드리지 않음
  });
}

/* 도서관 인증샷: 태블릿 카메라로 찍은 사진을 줄여서(최대 900px JPEG) 저장 — 선생님 화면에서 바로 확인 */
function uploadProof(rid,file){
  if(!file||!dbRef)return;
  const msg=document.getElementById("proofMsg");
  if(msg)msg.textContent="사진 올리는 중...";
  const img=new Image();
  const url=URL.createObjectURL(file);
  img.onload=()=>{
    const max=900,sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    const data=cv.toDataURL("image/jpeg",0.7);
    dbRef.child("photos/"+rid).set({data,ts:Date.now()})
      .then(()=>{if(msg)msg.textContent="✅ 올렸어요! 선생님께 확인을 받으세요.";})
      .catch(e=>{if(msg)msg.textContent="올리지 못했어요: "+e.message;});
  };
  img.onerror=()=>{if(msg)msg.textContent="사진을 읽지 못했어요. 다시 찍어주세요.";};
  img.src=url;
}

/* ===================== 학생: 홈 (교실 지도) ===================== */
function roomState(rid){
  if(isOk(missions,rid))return "done";
  const o=occupy[rid];
  if(!o)return "free";
  return String(o.team)===team?"mine":"busy";
}
function renderHome(){
  view="home";
  setScene("village");
  setHeader();
  const cnt=okCount(missions);
  let h='<img class="decor-img gs-flicker" src="assets/prop_lantern.png" alt="" style="left:2%;bottom:6%;width:64px;filter:drop-shadow(0 0 22px rgba(255,180,80,.6));">'
    +'<img class="decor-img" src="assets/common_spider_web.png" alt="" style="right:0;top:0;width:110px;opacity:.5;">';
  if(cnt>=MISSION_COUNT){
    h+='<div class="finale" style="padding:20px 16px;"><div class="em">🎉🏆✨</div><h2>모든 미션 완료!</h2><p>정말 대단해요! 우리 조가 방탈출에 성공했어요.</p></div>';
  }
  const mine=myRoomNow();
  h+='<div class="stage"><div class="side-panel">';
  h+='<img class="team-icon-img" src="'+teamIconSrc(Number(team))+'" alt="'+team+'조">';
  h+='<div class="key-row">';
  for(let i=0;i<MISSION_COUNT;i++)h+='<img class="key-icon'+(i<cnt?"":" off")+'" src="assets/common_key.png" alt="">';
  h+='</div>';
  h+='<div class="note-box">열쇠 '+cnt+' / '+MISSION_COUNT+'<br><span class="sub">6개 교실 미션 모두 성공 시 탈출</span></div>';
  h+='<div class="note-box" style="font-size:12px;text-align:left;font-weight:700;line-height:1.9;">🟢 비어 있음 · 가도 돼요<br>🔴 사용 중 · 다른 조 미션 중<br>🟡 우리 조 미션 중<br>✅ 우리 조 성공</div>';
  if(mine)h+='<button class="btn btn-lg btn-primary" onclick="openRoomDetail(\''+mine+'\')">🟡 '+escapeHtml(roomOf(mine).name)+' 미션 화면</button>';
  h+='<div class="team-switch" onclick="switchTeam()">다른 조 선택</div>';
  h+='</div><div class="room-grid-3col">';
  allRooms().forEach(r=>{
    const st=roomState(r.id);
    const o=occupy[r.id];
    let badge;
    if(st==="done")badge='<div class="room-prog">✅ 우리 조 성공!</div>';
    else if(st==="mine")badge='<div class="room-prog" style="color:var(--gs-gold)">🟡 우리 조 미션 중</div>';
    else if(st==="busy")badge='<div class="room-prog" style="color:var(--gs-red)">🔴 사용 중 ('+escapeHtml(o.team)+'조)</div>';
    else badge='<div class="room-prog" style="color:var(--gs-green)">🟢 비어 있음</div>';
    const style=st==="busy"?"filter:saturate(.35) brightness(.7);border-color:rgba(255,143,160,.7);":st==="mine"?"border-color:var(--gs-gold);box-shadow:0 0 22px rgba(255,205,120,.7);":"";
    h+='<div class="room-card has-photo'+(st==="done"?" done":"")+'" style="--room-photo:url(\'assets/'+r.photo+'\');'+style+'" onclick="openRoomDetail(\''+r.id+'\')">'
      +'<div class="room-name">'+r.emoji+' '+escapeHtml(r.name)+'</div>'
      +'<div class="room-mission">'+escapeHtml(r.title)+'</div>'+badge+'</div>';
  });
  h+='</div></div>';
  app.innerHTML=h;
  if(pendingCelebration){pendingCelebration=false;showCelebration();}
}
function openRoomDetail(rid){view="roomDetail";renderRoomDetail(rid);}
function goHome(){view="home";renderHome();}

/* ===================== 학생: 교실 미션 화면 ===================== */
function renderRoomDetail(rid){
  const r=roomOf(rid);
  if(!r){goHome();return;}
  view="roomDetail";currentRoomDetailId=rid;
  setScene("study");
  setHeader();
  const st=roomState(rid);
  const o=occupy[rid];
  // 영상이 재생 중일 때 실시간 갱신으로 화면을 통째로 다시 그리면 영상이 끊기므로, 상태 영역만 갈아끼운다
  const ytEl=document.getElementById("ytFrame");
  if(ytEl&&ytEl.dataset.rid===rid&&document.getElementById("missionStatus")){
    document.getElementById("missionStatus").innerHTML=statusHtml(rid,st,o);
    return;
  }
  let h='<div class="top-back" onclick="goHome()">← 교실 지도로</div>';
  h+='<div class="parchment-frame"><div class="parchment-frame-inner">';
  h+='<img class="room-photo-lg" src="assets/'+r.photo+'" alt="">';
  h+='<div class="room-title">'+r.emoji+' '+escapeHtml(r.name)+'</div>';
  h+='<span class="mission-badge">협동 미션</span>';
  h+='<div class="mission-title">'+escapeHtml(r.title)+'</div>';
  h+='<div class="mission-goal"><span class="lbl">🎯 미션 목표</span>'+escapeHtml(r.goal)+'</div>';
  h+='<div id="missionStatus" style="width:100%">'+statusHtml(rid,st,o)+'</div>';
  if(r.desc)h+='<div class="mission-desc">'+escapeHtml(r.desc)+'</div>';
  const emb=youtubeEmbed(r.yt);
  if(emb){
    h+='<div class="mission-desc" style="white-space:normal;font-weight:800;">📺 연습 영상</div>';
    h+='<div class="yt-wrap"><iframe id="ytFrame" data-rid="'+rid+'" src="'+emb+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
    h+='<a class="yt-link" href="'+escapeHtml(r.yt)+'" target="_blank" rel="noopener">▶ 영상이 안 나오면 여기를 눌러 유튜브에서 보기</a>';
  }
  if(r.photoProof){
    const p=photos[rid];
    h+='<div class="photo-box"><b style="font-size:14px;">📸 인증샷</b>'
      +'<div style="margin-top:8px;"><label class="btn btn-sub" style="display:inline-block;padding:10px 16px;font-size:14px;">📸 인증샷 찍기<input type="file" accept="image/*" capture="environment" style="display:none" onchange="uploadProof(\''+rid+'\',this.files[0])"></label></div>'
      +'<div id="proofMsg" style="font-size:12px;margin-top:6px;font-weight:700;"></div>'
      +(p&&p.data?'<img src="'+p.data+'" alt="인증샷">':'')+'</div>';
  }
  h+='</div></div>';
  h+='<button class="btn btn-lg btn-sub" style="margin-top:14px;max-width:520px;display:block;margin-left:auto;margin-right:auto;" onclick="goHome()">← 교실 지도로</button>';
  app.innerHTML=h;
}
function statusHtml(rid,st,o){
  if(st==="done")return '<div class="fb-box fb-ok"><img src="assets/status_success.png" alt="">미션 성공! 이 교실의 열쇠를 얻었어요 🔑</div>';
  if(st==="busy")return '<div class="wait-box" style="color:var(--gs-red)">🔴 지금 <b>'+escapeHtml(o.team)+'조</b>가 이 교실에서 미션 중이에요.<br>다른 빈 교실(🟢)에 먼저 가보세요! 비면 바로 화면이 바뀌어요.</div>';
  if(st==="mine")return '<div class="wait-box">🟡 <b>우리 조 미션 진행 중!</b><br>미션에 성공하면 선생님께 <b>"미션 성공"</b>을 눌러달라고 하세요.<br>선생님이 누르면 이 화면이 자동으로 바뀌어요.</div>'
    +'<div style="margin-top:8px;font-size:12px;"><span style="text-decoration:underline;cursor:pointer;color:var(--gs-ink-brown-2);" onclick="leaveMission(\''+rid+'\')">미션 그만두고 교실 비우기</span></div>';
  return '<div class="wait-box" style="color:var(--gs-green)">🟢 지금 비어 있어요! 교실에 도착하면 아래 버튼을 눌러주세요.</div>'
    +'<button class="btn btn-lg btn-primary" style="margin-top:10px" onclick="startMission(\''+rid+'\')">🚪 우리 조가 이 교실에서 미션 시작!</button>';
}

/* ===================== 학생: 성공 알림 · 축하 화면 ===================== */
function handleMissionChanges(){
  if(prevMissions===null){prevMissions=Object.assign({},missions);return;} // 첫 수신 때는 알림 없음
  const newly=MISSION_TEMPLATES.filter(t=>isOk(missions,t.id)&&!isOk(prevMissions,t.id));
  prevMissions=Object.assign({},missions);
  if(!newly.length||appMode!=="student")return;
  if(okCount(missions)>=MISSION_COUNT){
    document.querySelectorAll("#studentRoot .modal-ov").forEach(m=>m.remove());
    setTimeout(showCelebration,300);return;
  }
  const r=roomOf(newly[0].id);
  showInfoModal("assets/common_key.png",r.emoji+" "+escapeHtml(r.name)+" 미션 성공!","열쇠를 하나 얻었어요! 🔑 ("+okCount(missions)+" / "+MISSION_COUNT+")<br><br>교실 지도에서 🟢 <b>비어 있는</b> 다음 교실로 이동하세요!","교실 지도 보기");
}
function claimCompletionRank(){
  if(!dbRef)return Promise.resolve(null);
  return dbRef.child("completionRank").once("value").then(snap=>{
    if(snap.exists())return snap.val();
    return dbRoot.child("meta/completionCounter").transaction(cur=>(cur||0)+1).then(res=>{
      if(!res.committed)return null;
      const rank=res.snapshot.val();
      dbRef.child("completionRank").set(rank);
      return rank;
    });
  }).catch(()=>null);
}
function showCelebration(){
  const ov=document.createElement("div");
  ov.className="celebrate-ov";
  let keys='<div class="key-row">';
  for(let i=0;i<MISSION_COUNT;i++)keys+='<img class="key-icon" src="assets/common_key.png" alt="">';
  keys+='</div>';
  ov.innerHTML='<canvas class="confetti-cv" id="confettiCv"></canvas>'
    +'<div class="celebrate-inner">'
    +'<div class="side-panel"><img class="team-icon-img" src="'+teamIconSrc(Number(team))+'" alt="'+team+'조"><div class="curse-title">저주가<br>풀렸다</div>'+keys+'</div>'
    +'<div><img class="chest-img" src="assets/prop_treasure_chest.png" alt="">'
    +'<div class="result-card"><div style="font-family:\'Nanum Myeongjo\',serif;font-size:22px;font-weight:800;color:var(--gs-ink-brown);text-align:center;">열쇠 '+MISSION_COUNT+'개를 모두 되찾았다</div>'
    +'<div id="rankBadge" style="text-align:center;font-size:14px;font-weight:800;color:#a8741a;min-height:1.4em;margin-top:6px;"></div>'
    +'<div class="result-stats">'
    +'<div class="result-stat"><div class="label">성공한 미션</div><div class="value">'+MISSION_COUNT+' / '+MISSION_COUNT+'</div></div>'
    +'<div class="result-stat"><div class="label">팀워크</div><div class="value">최고!</div></div>'
    +'</div>'
    +'<div style="margin-top:20px;font-size:14.5px;line-height:1.9;color:var(--gs-ink-brown-2);">함께 힘을 모은 덕분에 유령들이 손을 흔들며 사라졌습니다.<br>학교는 다시 조용해졌어요.</div>'
    +'<button class="btn btn-lg btn-primary" style="margin-top:22px" onclick="this.closest(\'.celebrate-ov\').remove()">확인</button>'
    +'</div></div></div>';
  document.getElementById("studentRoot").appendChild(ov);
  runConfetti();
  claimCompletionRank().then(rank=>{
    if(!rank)return;
    const badge=document.getElementById("rankBadge");
    if(badge)badge.textContent="🏅 "+rank+"번째로 방탈출에 성공했어요!";
  });
}
function runConfetti(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.getElementById("confettiCv");
  if(!cv)return;
  cv.width=window.innerWidth;cv.height=window.innerHeight;
  const ctx=cv.getContext("2d");
  const colors=["#FFD700","#FF6B9D","#4DA3E8","#2DAA6E","#B15CFF","#E8833A"];
  const pieces=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height,w:6+Math.random()*6,h:8+Math.random()*10,vy:2+Math.random()*3,vx:-1.5+Math.random()*3,rot:Math.random()*360,vr:-6+Math.random()*12,color:colors[Math.floor(Math.random()*colors.length)]}));
  let frame=0;
  function tick(){
    frame++;
    if(!document.getElementById("confettiCv"))return;
    ctx.clearRect(0,0,cv.width,cv.height);
    pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
    if(frame<260)requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  tick();
}

/* ===================== 데이터 연결 ===================== */
function rerenderStudent(){
  if(appMode!=="student")return;
  if(view==="teamPick")renderTeamPick();
  else if(view==="home")renderHome();
  else if(view==="roomDetail")renderRoomDetail(currentRoomDetailId);
}
function connectTeam(){
  if(!team)return;
  if(dbRef)dbRef.off();
  prevMissions=null;
  dbRef=db.ref(ESC_ROOT+"/team"+team);
  dbRef.on("value",snap=>{
    setSync("on");
    const d=snap.val()||{};
    missions=d.missions||{};
    photos=d.photos||{};
    handleMissionChanges();
    if(view==="home")renderHome();
    else if(view==="roomDetail")renderRoomDetail(currentRoomDetailId);
    else setHeader();
  },()=>setSync("err"));
}
function connectShared(){
  db.ref(".info/connected").on("value",s=>setSync(s.val()?"on":"off"));
  db.ref(ESC_ROOT+"/occupy").on("value",snap=>{
    occupy=snap.val()||{};
    if(appMode==="student"&&(view==="home"||view==="roomDetail"))rerenderStudent();
  });
  db.ref(ESC_ROOT+"/roster").on("value",snap=>{
    rosterAll=snap.val()||{};
    if(appMode==="student"&&view==="teamPick")renderTeamPick();
    if(appMode==="admin"){renderRosterTab();renderAdminViews();}
  });
  db.ref(ESC_ROOT+"/meta/teamCount").on("value",snap=>{
    teamCount=snap.exists()?(snap.val()||0):5; // 설정 전에는 기본 5개 조
    if(appMode==="student"&&team&&Number(team)>teamCount&&snap.exists()){
      leaveTeam();view="teamPick";renderTeamPick();return;
    }
    if(appMode==="student"&&view==="teamPick")renderTeamPick();
    if(appMode==="admin"){renderRosterTab();renderAdminViews();}
  });
  db.ref(ESC_ROOT+"/meta/roomCustom").on("value",snap=>{
    roomCustom=snap.val()||{};
    rerenderStudent();renderAdminViews();
  });
  db.ref(ESC_ROOT+"/meta/missionCustom").on("value",snap=>{
    missionCustom=snap.val()||{};
    if(appMode==="student"&&view==="roomDetail"){const f=document.getElementById("ytFrame");if(f)f.removeAttribute("id");}
    rerenderStudent();renderAdminViews();
  });
}

/* ===================== 시작 ===================== */
connectShared();
connectAdminPw();
if(sessionStorage.getItem("mission_want_public_guide")==="1"){
  sessionStorage.removeItem("mission_want_public_guide");
  showPublicGuide();
}else if(sessionStorage.getItem("mission_admin_ok")==="1"){
  enterAdminMode();
}else if(team&&!teacherParam){
  connectTeam();
  view="home";renderHome();
}else{
  view="teamPick";renderTeamPick();
}
</script>
